version: '3.8'

services:
  # Frontend - Next.js Web Application
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        RUN_WEB_BUILD: "true"
    container_name: audion-web
    command: npm run start --workspace apps/web
    ports:
      - "3000:3005"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_BASE_PATH=${NEXT_PUBLIC_BASE_PATH:-}
      - NEXT_PUBLIC_PERSONA_BACKEND_URL=${NEXT_PUBLIC_PERSONA_BACKEND_URL:-http://api:8000}
      - NEXT_PUBLIC_CHAT_API_URL=${NEXT_PUBLIC_CHAT_API_URL:-http://chat-api:8001}
      - NEXT_PERSONA_BACKEND_INTERNAL_URL=http://api:8000
    depends_on:
      - api
      - chat-api
    healthcheck:
      # Use wget - modern Node images might not have fetch in a way that works for this
      test: [ "CMD-SHELL", "wget -q --spider http://localhost:3005/api/health || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    restart: unless-stopped

  # Backend API - FastAPI Service
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: audion-api
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - QDRANT_URL=${QDRANT_URL:-http://audion-qdrant:6333}
      - NEO4J_URI=${NEO4J_URI:-bolt://audion-neo4j:7687}
      - NEO4J_USER=${NEO4J_USER:-neo4j}
      - NEO4J_PASSWORD=${GRAPH_DB_PASSWORD}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - CLAUDE_API_KEY=${CLAUDE_API_KEY:-}
      - APP_ENV=${APP_ENV:-production}
    # Removed depends_on for Databases as they are now external services
    healthcheck:
      # Use python to check health endpoint
      test: [ "CMD-SHELL", "python3 -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8000/health\")'" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    restart: unless-stopped

  # Chat API - FastAPI Service for Chat
  chat-api:
    build:
      context: .
      dockerfile: apps/chat-api/Dockerfile
    container_name: audion-chat-api
    ports:
      - "8001:8001"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - QDRANT_URL=${QDRANT_URL:-http://audion-qdrant:6333}
      - NEO4J_URI=${NEO4J_URI:-bolt://audion-neo4j:7687}
      - NEO4J_USER=${NEO4J_USER:-neo4j}
      - NEO4J_PASSWORD=${GRAPH_DB_PASSWORD}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - INDEXING_API_URL=http://indexing-api:8000
      - REDIS_URL=${REDIS_URL}
      - APP_ENV=${APP_ENV:-production}
    depends_on:
      - api
      - indexing-api
    healthcheck:
      # Use python to check health endpoint
      test: [ "CMD-SHELL", "python3 -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8001/health/\")'" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    restart: unless-stopped

  # Indexing API - Document Processing Service
  indexing-api:
    build:
      context: .
      dockerfile: apps/indexing-api/Dockerfile
    container_name: audion-indexing-api
    # No external port - only internal access
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - QDRANT_URL=${QDRANT_URL:-http://audion-qdrant:6333}
      - REDIS_URL=${REDIS_URL}
      - APP_ENV=${APP_ENV:-production}
    # Removed depends_on for Databases
    healthcheck:
      # Use python to check health endpoint - Note: indexing-api runs on 8000 internally
      test: [ "CMD-SHELL", "python3 -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8000/health/\")'" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    restart: unless-stopped

  # Celery Worker - Background Job Processing
  celery-worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: audion-celery-worker
    command: celery -A app.celery_app worker --loglevel=info --concurrency=2
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - QDRANT_URL=${QDRANT_URL:-http://audion-qdrant:6333}
      - NEO4J_URI=${NEO4J_URI:-bolt://audion-neo4j:7687}
      - NEO4J_USER=${NEO4J_USER:-neo4j}
      - NEO4J_PASSWORD=${GRAPH_DB_PASSWORD}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - CLAUDE_API_KEY=${CLAUDE_API_KEY:-}
      - APP_ENV=${APP_ENV:-production}
    depends_on:
      - api
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "celery", "-A", "app.celery_app", "inspect", "ping" ]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Celery Beat - Scheduled Tasks
  celery-beat:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: audion-celery-beat
    command: celery -A app.celery_app beat --loglevel=info
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - APP_ENV=${APP_ENV:-production}
    depends_on:
      - api
    restart: unless-stopped

networks:
  default:
    name: audion-network
    driver: bridge
