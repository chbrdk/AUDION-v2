version: '3.8'

services:
  # Frontend - Next.js Web Application
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        RUN_WEB_BUILD: "true"
    container_name: audion-web
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_BASE_PATH=${NEXT_PUBLIC_BASE_PATH:-}
      - NEXT_PUBLIC_PERSONA_BACKEND_URL=${NEXT_PUBLIC_PERSONA_BACKEND_URL:-http://api:8000}
      - NEXT_PUBLIC_CHAT_API_URL=${NEXT_PUBLIC_CHAT_API_URL:-http://chat-api:8001}
      - NEXT_PERSONA_BACKEND_INTERNAL_URL=http://api:8000
    depends_on:
      - api
      - chat-api
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped

  # Backend API - FastAPI Service
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: audion-api
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - QDRANT_URL=${QDRANT_URL:-http://qdrant:6333}
      - NEO4J_URI=${NEO4J_URI:-bolt://neo4j:7687}
      - NEO4J_USER=${NEO4J_USER:-neo4j}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - CLAUDE_API_KEY=${CLAUDE_API_KEY:-}
      - APP_ENV=${APP_ENV:-production}
    depends_on:
      - qdrant
      - neo4j
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped

  # Chat API - FastAPI Service for Chat
  chat-api:
    build:
      context: .
      dockerfile: apps/chat-api/Dockerfile
    container_name: audion-chat-api
    ports:
      - "8001:8001"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - QDRANT_URL=${QDRANT_URL:-http://qdrant:6333}
      - NEO4J_URI=${NEO4J_URI:-bolt://neo4j:7687}
      - NEO4J_USER=${NEO4J_USER:-neo4j}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - INDEXING_API_URL=http://indexing-api:8000
      - APP_ENV=${APP_ENV:-production}
    depends_on:
      - api
      - indexing-api
      - qdrant
      - neo4j
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped

  # Indexing API - Document Processing Service
  indexing-api:
    build:
      context: .
      dockerfile: apps/indexing-api/Dockerfile
    container_name: audion-indexing-api
    # No external port - only internal access
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - QDRANT_URL=${QDRANT_URL:-http://qdrant:6333}
      - APP_ENV=${APP_ENV:-production}
    depends_on:
      - qdrant
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped

  # Celery Worker - Background Job Processing
  celery-worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: audion-celery-worker
    command: celery -A app.celery_app worker --loglevel=info --concurrency=2
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - QDRANT_URL=${QDRANT_URL:-http://qdrant:6333}
      - NEO4J_URI=${NEO4J_URI:-bolt://neo4j:7687}
      - NEO4J_USER=${NEO4J_USER:-neo4j}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - CLAUDE_API_KEY=${CLAUDE_API_KEY:-}
      - APP_ENV=${APP_ENV:-production}
    depends_on:
      - api
      - qdrant
      - neo4j
    restart: unless-stopped

  # Celery Beat - Scheduled Tasks
  celery-beat:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: audion-celery-beat
    command: celery -A app.celery_app beat --loglevel=info
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - APP_ENV=${APP_ENV:-production}
    depends_on:
      - api
    restart: unless-stopped
    volumes:
      - celery-beat-data:/app/apps/api

  # Qdrant - Vector Database
  qdrant:
    image: qdrant/qdrant:v1.11.3
    container_name: audion-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:6333/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # Neo4j - Graph Database
  neo4j:
    image: neo4j:5.22.0
    container_name: audion-neo4j
    ports:
      - "7474:7474"  # HTTP
      - "7687:7687"  # Bolt
    environment:
      - NEO4J_AUTH=${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD}
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*
      - NEO4J_dbms_security_procedures_allowlist=apoc.*
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:7474"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped

volumes:
  qdrant_data:
    driver: local
  neo4j_data:
    driver: local
  neo4j_logs:
    driver: local
  celery-beat-data:
    driver: local

networks:
  default:
    name: audion-network
    driver: bridge
  # Optional: Connect to Coolify's predefined network to access Database Resources
  # Uncomment this if "Connect To Predefined Network" is enabled in Coolify
  # coolify:
  #   external: true
