version: "3.9"

x-build-web: &web-build
  context: ..
  dockerfile: apps/web/Dockerfile
  target: runner
  args:
    NODE_IMAGE: ${WEB_NODE_IMAGE:-node:22.11.0-alpine}
    RUN_WEB_BUILD: ${WEB_RUN_BUILD:-false}
  cache_from:
    - type=local,src=${LOCAL_DOCKER_CACHE_ROOT:-/tmp/persona-docker-cache}/web
  # cache_to temporarily disabled due to docker driver limitation
  # cache_to:
  #   - type=local,dest=${LOCAL_DOCKER_CACHE_ROOT:-/tmp/persona-docker-cache}/web,mode=max

x-build-python: &python-build
  context: ..
  target: runtime
  args:
    UV_IMAGE: ${PYTHON_UV_IMAGE:-ghcr.io/astral-sh/uv:python3.12-bookworm}
    PYTHON_IMAGE: ${PYTHON_RUNTIME_IMAGE:-python:3.12-slim}
  cache_from:
    - type=local,src=${LOCAL_DOCKER_CACHE_ROOT:-/tmp/persona-docker-cache}/python
  # cache_to temporarily disabled due to docker driver limitation
  # cache_to:
  #   - type=local,dest=${LOCAL_DOCKER_CACHE_ROOT:-/tmp/persona-docker-cache}/python,mode=max

services:
  postgres:
    image: postgres:17
    container_name: persona-postgres
    environment:
      POSTGRES_DB: persona
      POSTGRES_USER: persona
      POSTGRES_PASSWORD: persona
    ports:
      - "55432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: persona-redis
    ports:
      - "6380:6379"

  qdrant:
    image: qdrant/qdrant:v1.11.3
    container_name: persona-qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant-data:/qdrant/storage

  neo4j:
    image: neo4j:5.22.0
    container_name: persona-neo4j
    environment:
      NEO4J_AUTH: neo4j/neo4j_password
    ports:
      - "7687:7687"
      - "7474:7474"
    volumes:
      - neo4j-data:/data

  tempo:
    image: grafana/tempo:2.6.0
    container_name: persona-tempo
    command: [ "-config.file=/tempo.yaml" ]
    volumes:
      - ./tempo.yml:/tempo.yaml
      - tempo-data:/tmp/tempo
    ports:
      - "4318:4318"

  indexing-api:
    image: ${INDEXING_API_IMAGE:-persona-chat/indexing-api:dev}
    build:
      <<: *python-build
      dockerfile: apps/indexing-api/Dockerfile
    container_name: persona-indexing-api
    environment:
      APP_ENV: development
      API_HOST: 0.0.0.0
      API_PORT: 8000
      DATA_DIR: /app/data/uploads
      DATABASE_URL: postgresql+psycopg://persona:persona@postgres:5432/persona
      REDIS_URL: redis://redis:6379/0
      QDRANT_URL: http://qdrant:6333
      OTEL_EXPORTER_OTLP_ENDPOINT: http://tempo:4318
      LOGFIRE_TOKEN: ${LOGFIRE_TOKEN:-}
    volumes:
      - ../data:/app/data
      - huggingface-cache:/root/.cache/huggingface
    depends_on:
      - postgres
      - redis
      - qdrant
      - tempo
    expose:
      - "8000"

  indexing-worker:
    image: ${INDEXING_API_IMAGE:-persona-chat/indexing-api:dev}
    container_name: persona-indexing-worker
    command: celery -A app.workers.process worker -Q indexing -l info --pool=threads --concurrency=2
    environment:
      APP_ENV: development
      DATA_DIR: /app/data/uploads
      DATABASE_URL: postgresql+psycopg://persona:persona@postgres:5432/persona
      REDIS_URL: redis://redis:6379/0
      QDRANT_URL: http://qdrant:6333
      OTEL_EXPORTER_OTLP_ENDPOINT: http://tempo:4318
      LOGFIRE_TOKEN: ${LOGFIRE_TOKEN:-}
    volumes:
      - ../data:/app/data
      - huggingface-cache:/root/.cache/huggingface
    depends_on:
      - indexing-api
      - postgres
      - redis
      - qdrant

  chat-api:
    image: ${CHAT_API_IMAGE:-persona-chat/chat-api:dev}
    build:
      <<: *python-build
      dockerfile: apps/chat-api/Dockerfile
    container_name: persona-chat-api
    env_file:
      - ../.env
    environment:
      APP_ENV: development
      API_HOST: 0.0.0.0
      API_PORT: 8001
      DATABASE_URL: postgresql+psycopg://persona:persona@postgres:5432/persona
      QDRANT_URL: http://qdrant:6333
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: neo4j_password
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      INDEXING_API_URL: http://indexing-api:8000
      OTEL_EXPORTER_OTLP_ENDPOINT: http://tempo:4318
      LOGFIRE_TOKEN: ${LOGFIRE_TOKEN:-}
    volumes:
      - huggingface-cache:/root/.cache/huggingface
    depends_on:
      - postgres
      - qdrant
      - neo4j
      - tempo
    expose:
      - "8001"

  persona-api:
    image: ${PERSONA_API_IMAGE:-persona-chat/persona-api:dev}
    build:
      <<: *python-build
      dockerfile: apps/api/Dockerfile
    container_name: persona-backend-api
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 2G
    env_file:
      - ../.env
    environment:
      APP_ENV: development
      API_HOST: 0.0.0.0
      API_PORT: 8000
      DATABASE_URL: postgresql+psycopg://persona:persona@postgres:5432/persona
      REDIS_URL: redis://redis:6379/0
      DATA_DIR: /app/data/uploads
      QDRANT_URL: http://qdrant:6333
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: neo4j_password
      NEO4J_BROWSER_URL: https://192.168.50.101/neo4j/browser
      NEO4J_BLOOM_URL: https://192.168.50.101/neo4j/bloom
      CLAUDE_API_KEY: ${CLAUDE_API_KEY:-${ANTHROPIC_API_KEY:-}}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://tempo:4318
      LOGFIRE_TOKEN: ${LOGFIRE_TOKEN:-}
      PERSONA_CONSOLE_BASE_URL: ${PERSONA_CONSOLE_BASE_URL:-http://localhost:3000}
      PERSONA_MEDIA_BASE_PATH: ${PERSONA_MEDIA_BASE_PATH:-/personas}
      PERSONA_CACHE_TTL_SECONDS: ${PERSONA_CACHE_TTL_SECONDS:-300}
      PERSONA_BACKEND_PUBLIC_URL: ${PERSONA_BACKEND_PUBLIC_URL:-https://192.168.50.101/api/persona-backend}
      PERSONA_BACKEND_DOCS_URL: ${PERSONA_BACKEND_DOCS_URL:-https://192.168.50.101/api/persona-backend/docs}
      ROOT_PATH: /api/persona-backend
    volumes:
      - ../data:/app/data
      - huggingface-cache:/root/.cache/huggingface
    depends_on:
      - postgres
      - redis
      - qdrant
      - neo4j
      - tempo
    expose:
      - "8000"

  persona-worker:
    image: ${PERSONA_API_IMAGE:-persona-chat/persona-api:dev}
    container_name: persona-backend-worker
    env_file:
      - ../.env
    command: celery -A app.celery_app worker -Q ingestion -l info --pool=threads --concurrency=2
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql+psycopg://persona:persona@postgres:5432/persona
      REDIS_URL: redis://redis:6379/0
      DATA_DIR: /app/data/uploads
      QDRANT_URL: http://qdrant:6333
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: neo4j_password
      CLAUDE_API_KEY: ${CLAUDE_API_KEY:-${ANTHROPIC_API_KEY:-}}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://tempo:4318
      LOGFIRE_TOKEN: ${LOGFIRE_TOKEN:-}
    volumes:
      - ../data:/app/data
      - huggingface-cache:/root/.cache/huggingface
    depends_on:
      - persona-api
      - postgres
      - redis
      - qdrant
      - neo4j
      - tempo

  web:
    image: ${WEB_IMAGE:-persona-chat/web:dev}
    build:
      <<: *web-build
    container_name: persona-web
    env_file:
      - ../.env
    environment:
      NEXT_PUBLIC_INDEXING_API_URL: https://192.168.50.101/api/indexing
      NEXT_PUBLIC_CHAT_API_URL: https://192.168.50.101/api/chat
      NEXT_PUBLIC_WS_BASE_URL: wss://192.168.50.101/api/chat
      NEXT_PUBLIC_PERSONA_BACKEND_URL: https://192.168.50.101/api/persona-backend
      NEXT_PUBLIC_PERSONA_BACKEND_DOCS_URL: https://192.168.50.101/api/persona-backend/docs
      NEXT_BACKEND_INTERNAL_URL: http://indexing-api:8000
      NEXT_CHAT_API_INTERNAL_URL: http://chat-api:8001
      NEXT_PERSONA_BACKEND_INTERNAL_URL: http://persona-api:8000
    volumes:
      - ../apps/web:/app/apps/web
      - ../packages/types:/app/packages/types
      - web-node-modules:/app/node_modules
      - web-next-cache:/app/apps/web/.next
    depends_on:
      - indexing-api
      - chat-api
      - persona-api
    expose:
      - "3000"

  nginx:
    image: nginx:alpine
    container_name: persona-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - web
      - chat-api
      - indexing-api
      - persona-api

volumes:
  postgres-data:
  qdrant-data:
  neo4j-data:
  tempo-data:
  huggingface-cache:
  web-node-modules:
  web-next-cache:
