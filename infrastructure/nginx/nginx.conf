events {
    worker_connections 1024;
}

http {
    resolver 127.0.0.11 valid=30s;

    upstream web {
        zone web 64k;
        # Use service name (web) for DNS resolution
        server web:3000 resolve;
    }

    upstream chat-api {
        zone chat_api 64k;
        server audion-chat-api:8001 resolve;
    }

    upstream indexing-api {
        zone indexing_api 64k;
        server audion-indexing-api:8000 resolve;
    }

    upstream persona-api {
        zone persona_api 64k;
        server audion-backend-api:8000 resolve;
    }

    # HTTP to HTTPS redirect
    server {
        listen 80;
        server_name 192.168.50.101;
        return 301 https://$server_name$request_uri;
    }

    # HTTPS server
    server {
        listen 443 ssl;
        http2 on;
        server_name 192.168.50.101;
        client_max_body_size 200m;

        ssl_certificate /etc/nginx/ssl/cert.pem;
        ssl_certificate_key /etc/nginx/ssl/key.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        # Next.js WebSocket HMR - must be before other locations
        location /audion/_next/webpack-hmr {
            proxy_pass http://web;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
            proxy_read_timeout 86400;
            proxy_send_timeout 86400;
        }

        # Audion Web application - Root-Ebene
        location / {
            proxy_pass http://web;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
        }

        # Chat API - unter /audion/api/chat (für Audion)
        location /audion/api/chat {
            # Preserve /chat prefix for FastAPI router (prefixed with /chat)
            # Strip /audion/api prefix
            rewrite ^/audion/api/(.*)$ /$1 break;
            proxy_pass http://chat-api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 600s;
            proxy_connect_timeout 75s;
            proxy_send_timeout 600s;
            proxy_set_header Connection "";
            proxy_set_header Accept-Encoding "";
            chunked_transfer_encoding on;
        }

        # Chat API - unter /api/chat (für Kompatibilität)
        location /api/chat {
            # Preserve /chat prefix for FastAPI router (prefixed with /chat)
            # Strip only the /api part
            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass http://chat-api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 600s;
            proxy_connect_timeout 75s;
            proxy_send_timeout 600s;
            proxy_set_header Connection "";
            proxy_set_header Accept-Encoding "";
            chunked_transfer_encoding on;
        }

        # Voice API - unter /audion/api/voice (für Audion)
        location /audion/api/voice {
            rewrite ^/audion/api/voice(.*)$ /voice$1 break;
            proxy_pass http://chat-api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 600s;
            proxy_connect_timeout 75s;
            proxy_send_timeout 600s;
            proxy_set_header Connection "";
            proxy_set_header Accept-Encoding "";
            chunked_transfer_encoding on;
        }

        # Voice API - unter /api/voice (für Kompatibilität)
        location /api/voice {
            rewrite ^/api/voice(.*)$ /voice$1 break;
            proxy_pass http://chat-api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 600s;
            proxy_connect_timeout 75s;
            proxy_send_timeout 600s;
            proxy_set_header Connection "";
            proxy_set_header Accept-Encoding "";
            chunked_transfer_encoding on;
        }

        # Persona Backend API - unter /api/persona-backend
        location /api/persona-backend {
            proxy_pass http://persona-api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 300s;
            proxy_connect_timeout 75s;
            proxy_send_timeout 300s;
            proxy_buffering off;
            proxy_next_upstream error timeout invalid_header http_500 http_502 http_503;
            proxy_next_upstream_tries 2;
            proxy_next_upstream_timeout 10s;
        }

        # Indexing API - unter /api/indexing
        location /api/indexing {
            rewrite ^/api/indexing(.*)$ $1 break;
            proxy_pass http://indexing-api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Neo4j Browser - proxy to neo4j service
        location /neo4j/ {
            rewrite ^/neo4j/(.*)$ /$1 break;
            proxy_pass http://audion-neo4j:7474/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Prefix /neo4j;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}
