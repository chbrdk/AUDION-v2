[project]
name = "udg-glass-proto"
version = "0.1.0"
description = "Shared Pydantic schemas for Dynamic Persona Chat"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
dev-dependencies = [
    "ruff>=0.7.4",
    "mypy>=1.13.0",
]

