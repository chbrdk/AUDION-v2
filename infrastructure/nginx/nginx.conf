events {
    worker_connections 1024;
}

http {
    resolver 127.0.0.11 valid=30s;

    upstream web {
        server web:3000;
    }

    upstream chat-api {
        server chat-api:8001;
    }

    upstream indexing-api {
        server indexing-api:8000;
    }

    upstream persona-api {
        server persona-api:8000;
    }

    # HTTP to HTTPS redirect
    server {
        listen 80;
        server_name 192.168.50.101;
        return 301 https://$server_name$request_uri;
    }

    # HTTPS server
    server {
        listen 443 ssl;
        http2 on;
        server_name 192.168.50.101;
        client_max_body_size 200m;

        ssl_certificate /etc/nginx/ssl/cert.pem;
        ssl_certificate_key /etc/nginx/ssl/key.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        # Web application
        location / {
            proxy_pass http://web;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
        }

        # Chat API - proxy to chat-api service
        location /api/chat {
            rewrite ^/api/chat(.*)$ /chat$1 break;
            proxy_pass http://chat-api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 600s;
            proxy_connect_timeout 75s;
            proxy_send_timeout 600s;
            # Keep connection alive for streaming
            proxy_set_header Connection "";
            # Disable gzip for streaming
            proxy_set_header Accept-Encoding "";
            chunked_transfer_encoding on;
        }

        # Voice API - proxy to chat-api service
        location /api/voice {
            rewrite ^/api/voice(.*)$ /voice$1 break;
            proxy_pass http://chat-api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 600s;
            proxy_connect_timeout 75s;
            proxy_send_timeout 600s;
            # Keep connection alive for streaming
            proxy_set_header Connection "";
            # Disable gzip for streaming
            proxy_set_header Accept-Encoding "";
            chunked_transfer_encoding on;
        }

        # Redirect bare path to slash to keep FastAPI docs working
        location = /api/persona-backend {
            return 301 /api/persona-backend/;
        }

        # Persona Backend API (management console)
        location /api/persona-backend {
            rewrite ^/api/persona-backend(.*)$ $1 break;
            proxy_pass http://persona-api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 300s;
            proxy_connect_timeout 75s;
            proxy_send_timeout 300s;
            proxy_buffering off;
            # Error handling
            proxy_next_upstream error timeout invalid_header http_500 http_502 http_503;
            proxy_next_upstream_tries 2;
            proxy_next_upstream_timeout 10s;
        }

        # Indexing API
        location /api/indexing {
            rewrite ^/api/indexing(.*)$ $1 break;
            proxy_pass http://indexing-api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Neo4j Browser - proxy to neo4j service
        location /neo4j/ {
            rewrite ^/neo4j/(.*)$ /$1 break;
            proxy_pass http://neo4j:7474/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Prefix /neo4j;
            # WebSocket support for Neo4j Browser
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        # Qdrant Dashboard - proxy to qdrant service
        location /qdrant/ {
            rewrite ^/qdrant/(.*)$ /$1 break;
            proxy_pass http://qdrant:6333/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}

