[project]
name = "chat-api"
version = "0.1.0"
description = "Real-time chat and persona service for Dynamic Persona Chat"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.121.2",
    "uvicorn[standard]==0.38.0",
    "websockets==15.0.1",
    "anthropic==0.73.0",
    "qdrant-client==1.16.0",
    "neo4j==6.0.3",
    "psycopg[binary]==3.2.12",
    "SQLAlchemy==2.0.44",
    "pydantic-settings==2.12.0",
    "httpx==0.28.1",
    "structlog==25.5.0",
    "logfire==4.14.2",
    "orjson==3.11.4",
    "FlagEmbedding==1.3.5",
    "tenacity==9.1.2",
    "opentelemetry-sdk==1.38.0",
    "opentelemetry-exporter-otlp==1.38.0",
    "faster-whisper==1.1.0",
    "python-multipart==0.0.12",
    "httpx==0.28.1",
    "openai>=1.0.0",
    "udg-glass-proto @ file:///app/packages/proto"
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]

[tool.uv]
dev-dependencies = [
    "ruff==0.14.5",
    "mypy==1.18.2",
    "pytest==8.3.4",
    "pytest-asyncio==0.24.0",
    "pytest-cov==5.0.0",
    "httpx==0.28.1"
]

