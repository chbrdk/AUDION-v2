[project]
name = "indexing-api"
version = "0.1.0"
description = "Document indexing and processing service for Dynamic Persona Chat"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.123.9",
    "uvicorn[standard]==0.38.0",
    "celery[redis]==5.6.0",
    "redis==5.2.1",
    "qdrant-client==1.16.0",
    "psycopg[binary]==3.2.12",
    "SQLAlchemy==2.0.44",
    "alembic==1.17.2",
    "python-multipart==0.0.20",
    "pydantic-settings==2.12.0",
    "httpx==0.28.1",
    "structlog==25.5.0",
    "logfire==4.14.2",
    "orjson==3.11.4",
    "FlagEmbedding==1.3.5",
    "unstructured[pdf]==0.18.20",
    "pillow==11.0.0",
    "pandas==2.2.3",
    "numpy==2.1.3",
    "tenacity==9.1.2",
    "opentelemetry-sdk==1.38.0",
    "opentelemetry-exporter-otlp==1.38.0",
    "python-slugify==8.0.4",
    "msqdx-glass-proto @ file:///app/packages/proto"
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]

[tool.uv]
dev-dependencies = [
    "ruff==0.14.5",
    "mypy==1.18.2",
    "pytest==8.3.4",
    "pytest-asyncio==0.24.0",
    "pytest-cov==5.0.0",
    "httpx==0.28.1"
]

